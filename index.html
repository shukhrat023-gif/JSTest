<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблицы</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <table>
        <tbody>

            <tr>
                <td colspan="2">Заголовок</td>
                <td>Ячейка1</td>
                
            </tr>

        </tbody>
        <thead>
            <tr>
                <td>Заголовок</td>
                <td rowspan="2">Ячейка1</td>
                <td>Ячейка2</td>
            </tr>

        </thead>
        <tfoot>
            <tr>
                <td>Заголовок</td>
                <td>Ячейка1</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
